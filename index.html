<!DOCTYPE html>
<html>
<body>
    <textarea id="multiInput" rows="10" placeholder="Paste Base62 lines here..."></textarea>
    <button id="convertBtn">Convert All</button>
    <pre id="outputLog"></pre>

    <script type="module">
        import { ObjectId } from 'bson';
        import base62 from 'base-x';

        const PYTHON_ALPHABET = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
        const b62 = base62(PYTHON_ALPHABET);

        function processB62ToBson(text) {
            const lines = text.split('\n').map(line => line.trim()).filter(line => line.length > 0);

            const results = lines.map(str => {
                try {
                    const decoded = b62.decode(str);
                    const hex = Array.from(decoded)
                        .map(b => b.toString(16).padStart(2, '0'))
                        .join('')
                        .padStart(24, '0');
                    
                    return new ObjectId(hex).toString(); 
                } catch (e) {
                    return `Error: Invalid input "${str}"`;
                }
            });

            return results;
        }

        function bsonToBase62(objectIdStr) {
            try {
                const hex = objectIdStr.trim();
                if (hex.length !== 24) throw new Error("Invalid BSON length");

                const bytes = new Uint8Array(
                    hex.match(/.{1,2}/g).map(byte => parseInt(byte, 16))
                );

                return b62.encode(bytes);
            } catch (e) {
                return `Error: ${e.message}`;
            }
        }

        document.getElementById('convertBtn').onclick = () => {
            const rawText = document.getElementById('multiInput').value;
            const results = processB62ToBson(rawText);
            
            document.getElementById('outputLog').innerText = results.join('\n');
        };
    </script>
</body>
</html>
